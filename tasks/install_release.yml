---
- name: Create package download directory
  become: true
  ansible.builtin.file:
    path: "{{ zabbix_release_download_directory }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  register: zabbix_release_directory_result

- name: Copy release package from controller
  when:
    - zabbix_release_source is not url
    - not ansible_check_mode or zabbix_release_directory_result is not changed
  become: true
  ansible.builtin.copy:
    src: "{{ zabbix_release_source }}"
    dest: "{{ zabbix_release_package_path }}"
    owner: root
    group: root
    mode: "0644"
  register: zabbix_release_copy_result

- name: Download Zabbix repo package
  when:
    - zabbix_release_source is url
    - not ansible_check_mode or zabbix_release_directory_result is not changed
  become: true
  ansible.builtin.get_url:
    url: "{{ zabbix_release_source }}"
    dest: "{{ zabbix_release_package_path }}"
    checksum: "{{ zabbix_release_checksum }}"
    owner: root
    group: root
    mode: "0644"
  register: zabbix_release_download_result

- name: Check release package file
  ansible.builtin.stat:
    path: "{{ zabbix_release_package_path }}"
    checksum_algorithm: sha256
  register: zabbix_release_package_stat

- name: Verify local package checksum
  when:
    - zabbix_release_source is not url
    - zabbix_release_checksum | length > 0
    - zabbix_release_package_stat.stat.exists
  ansible.builtin.assert:
    that:
      - "'sha256:' ~ zabbix_release_package_stat.stat.checksum == zabbix_release_checksum"
    fail_msg: "Release package checksum mismatch."

- name: Install Zabbix repository
  when: not ansible_check_mode or zabbix_release_package_stat.stat.exists
  block:
    - name: Install Zabbix repo package
      become: true
      ansible.builtin.apt:
        deb: "{{ zabbix_release_package_path }}"
      register: zabbix_release_install_result

    - name: Update apt cache
      become: true
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: "{{ 0 if zabbix_release_install_result is changed else zabbix_release_apt_cache_valid_time }}"
