---
# It is pointless to change zabbix_version to earlier as 8.0 changed the URL structure.
zabbix_version: "8.0"
zabbix_apt_cache_valid_time: 3600
zabbix_release: "https://repo.zabbix.com/zabbix/{{ zabbix_version }}/release/{{ ansible_distribution | lower }}/pool/main/z/zabbix-release/zabbix-release_latest_{{ zabbix_version }}+{{ ansible_distribution | lower }}{{ ansible_distribution_release | lower }}_all.deb"
zabbix_release_checksum: ""
zabbix_release_package: zabbix-release
zabbix_apt_sources_directory: /etc/apt/sources.list.d
zabbix_apt_source_patterns:
  - '*zabbix*'
zabbix_config_directory: /etc/zabbix